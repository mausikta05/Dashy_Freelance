name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm run test

      - name: Run Production Build
        run: npm run build

  smart-contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32v1-none

      - name: Install Stellar CLI
        run: |
          curl -LfsS https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz -o stellar.tar.gz
          tar -xvf stellar.tar.gz
          # The tarball contains a binary named 'stellar'
          sudo mv stellar /usr/local/bin/
          stellar --version

      - name: Build Contracts
        working-directory: SmartContract
        run: |
          # Build ProofWork first so its wasm exists for EscrowVault
          cargo build --manifest-path contracts/ProofWork/Cargo.toml --target wasm32v1-none --release
          stellar contract build

      - name: Run Rust Unit Tests
        working-directory: SmartContract
        run: cargo test
